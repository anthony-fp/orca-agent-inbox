name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  # The Orca commit whose validator checks this plugin. Bump it on purpose, as stablyai/orca-plugins does.
  ORCA_REF: 239e17f84fc920bc2be62b6a73336dc57fc0150b

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin
          persist-credentials: false

      - name: Check out Orca
        uses: actions/checkout@v4
        with:
          repository: stablyai/orca
          ref: ${{ env.ORCA_REF }}
          path: orca
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: orca/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: orca/pnpm-lock.yaml

      # The validator needs only Orca's JavaScript dependencies, not Electron.
      - name: Install Orca validator
        working-directory: orca
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build:packages

      # No Orca script writes .orca/types. `orca plugin types` copies these committed files
      # (src/cli/plugin-authoring/plugin-type-files.ts at ORCA_REF); this step does the same copy.
      - name: Write Orca plugin typings
        working-directory: orca/resources/plugins
        run: |
          t="$GITHUB_WORKSPACE/plugin/.orca/types"
          for m in host frame worker services testing; do
            mkdir -p "$t/orca-$m" && cp "types/orca-$m.d.ts" "$t/orca-$m/index.d.ts"
          done
          mkdir -p "$t/orca"
          cat declarative/orca{,-components,-components-layout,-components-data}.d.ts > "$t/orca/index.d.ts"
          cat > "$t/tsconfig.json" <<'EOF'
          {
            "compilerOptions": {
              "strict": true, "noEmit": true, "target": "ES2022", "module": "ESNext",
              "moduleResolution": "Bundler", "allowImportingTsExtensions": true, "isolatedModules": true,
              "jsx": "react-jsx", "jsxImportSource": "orca", "lib": ["ES2022", "DOM"], "preserveSymlinks": true,
              "typeRoots": ["."],
              "types": ["orca", "orca-host", "orca-frame", "orca-worker", "orca-services", "orca-testing"]
            }
          }
          EOF

      - name: Validate manifest and files
        working-directory: orca
        run: pnpm validate:plugin "$GITHUB_WORKSPACE/plugin"

      - name: Typecheck
        working-directory: plugin
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm run typecheck:worker
